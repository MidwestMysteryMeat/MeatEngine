name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast structural guard: the engine/ layer must never depend on game/. Fails
  # in seconds if the layering regresses, without waiting on a full build.
  layering:
    name: Layering guard (engine/ !-> game/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: engine/ must not include game/
        run: |
          if grep -rn '#include "game/' src/engine/ ; then
            echo "::error::engine/ must not include game/ — that inverts the layering"
            exit 1
          fi
          echo "OK: no game/ includes under engine/"

  linux:
    name: Linux (Ubuntu, GCC, Release)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # GL/X11 dev headers for GLFW's X11 backend, plus Wayland/EGL bits it
      # probes for; ninja for the generator; python3 + jinja2 for glad codegen.
      # build-essential guarantees gcc/g++/make on the runner.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            python3 python3-pip
          python3 -m pip install --user jinja2

      # Cache the whole build tree keyed on the dep + config files. The ~15-min
      # FetchContent build of Assimp/Jolt/etc. is skipped on a hit; Ninja still
      # recompiles our changed sources. Key busts when deps or CMake config change.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-release-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: build-${{ runner.os }}-release-

      - name: Configure
        run: cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # Headless trust-boundary tests — no GPU, window, or socket needed.
      - name: Test
        run: ./build/MeatTests

  sanitizers:
    name: Sanitizers (ASan+UBSan, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            python3 python3-pip
          python3 -m pip install --user jinja2

      # Separate cache key from the Release job: this is a Debug + sanitizer tree.
      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-asan-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: build-${{ runner.os }}-asan-

      # Debug + MEAT_SANITIZE instruments the engine/test targets (not deps).
      - name: Configure
        run: cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Debug -DMEAT_SANITIZE=ON

      # Only the test binary is needed to exercise the code under sanitizers.
      - name: Build tests
        run: cmake --build build --target MeatTests --parallel

      - name: Run tests under ASan+UBSan
        env:
          # Deps are uninstrumented, so ignore their benign leaks; halt on any
          # real UBSan/ASan error with a stack trace. The suppressions file
          # exempts FastNoiseLite's intentional hash wraparound (third-party);
          # our own signed-overflow checks stay fatal.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/.github/ubsan_suppressions.txt
        run: ./build/MeatTests

  render-smoke:
    name: Render smoke (headless GL, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      # Build deps + a software GL stack (mesa llvmpipe) and xvfb for a virtual
      # display, so the engine can open a real GL 4.5 context with no GPU.
      - name: Install build + headless-GL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            python3 python3-pip \
            xvfb libgl1-mesa-dri mesa-utils
          python3 -m pip install --user jinja2

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-release-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: build-${{ runner.os }}-release-

      - name: Configure
        run: cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Release

      - name: Build the engine
        run: cmake --build build --target MeatEngine --parallel

      # Render a few frames headlessly and require a non-trivial screenshot. A
      # shader/UBO regression (like the one that once broke ALL rendering) fails
      # engine init or produces a blank frame — caught here, not by players.
      - name: Render a frame under xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
        run: |
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./build/MeatEngine --shot /tmp/ci_shot.png
          ls -l /tmp/ci_shot_*.png
          python3 - <<'PY'
          import glob, os, sys
          files = sorted(glob.glob('/tmp/ci_shot_*.png'))
          if not files:
              sys.exit("no screenshot produced — engine init or capture failed")
          biggest = max(os.path.getsize(f) for f in files)
          print(f"largest screenshot: {biggest} bytes across {len(files)} frames")
          if biggest < 5000:
              sys.exit("screenshot suspiciously small — render likely produced a blank frame")
          PY

  windows:
    name: Windows (MSVC, Release)
    # Pin the stable VS2022 image: windows-latest now ships a PREVIEW VS2026 MSVC
    # whose sol2 template instantiation hangs (>27 min on one TU). VS2022 builds
    # the whole tree in minutes, matching local dev.
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # glad2's CMake picks the NEWEST python on the runner for its build-time
      # loader codegen, which isn't necessarily the one on PATH or the one a
      # single pip install targets. Installing jinja2 into every interpreter on
      # the box guarantees the one glad chooses can import it.
      - name: Install glad generator dependency (all runner pythons)
        shell: pwsh
        run: |
          Get-ChildItem C:\hostedtoolcache\windows\Python\*\x64\python.exe | ForEach-Object {
            Write-Host "installing jinja2 into $_"
            & $_ -m pip install --quiet jinja2
          }

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-release-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: build-${{ runner.os }}-release-

      - name: Configure
        run: cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Release

      # Build only the test binary — it compiles every engine source plus the
      # tests and is what the Test step runs, so MSVC coverage is preserved
      # without also compiling everything again for MeatEngine.exe.
      - name: Build
        run: cmake --build build --target MeatTests --parallel

      - name: Test
        run: .\build\MeatTests.exe
