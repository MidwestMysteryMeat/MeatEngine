name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast structural guard: the engine/ layer must never depend on game/. Fails
  # in seconds if the layering regresses, without waiting on a full build.
  layering:
    name: Layering guard (engine/ !-> game/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: engine/ must not include game/
        run: |
          if grep -rn '#include "game/' src/engine/ ; then
            echo "::error::engine/ must not include game/ — that inverts the layering"
            exit 1
          fi
          echo "OK: no game/ includes under engine/"

  linux:
    name: Linux (Ubuntu, GCC, Release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GL/X11 dev headers for GLFW's X11 backend, plus Wayland/EGL bits it
      # probes for; ninja for the generator; python3 + jinja2 for glad codegen.
      # build-essential guarantees gcc/g++/make on the runner.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            python3 python3-pip
          python3 -m pip install --user jinja2

      - name: Configure
        run: cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      # Headless trust-boundary tests — no GPU, window, or socket needed.
      - name: Test
        run: ./build/MeatTests

  sanitizers:
    name: Sanitizers (ASan+UBSan, Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ninja-build \
            libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            python3 python3-pip
          python3 -m pip install --user jinja2

      # Debug + MEAT_SANITIZE instruments the engine/test targets (not deps).
      - name: Configure
        run: cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Debug -DMEAT_SANITIZE=ON

      # Only the test binary is needed to exercise the code under sanitizers.
      - name: Build tests
        run: cmake --build build --target MeatTests --parallel

      - name: Run tests under ASan+UBSan
        env:
          # Deps are uninstrumented, so ignore their benign leaks; halt on any
          # real UBSan/ASan error with a stack trace. The suppressions file
          # exempts FastNoiseLite's intentional hash wraparound (third-party);
          # our own signed-overflow checks stay fatal.
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=${{ github.workspace }}/.github/ubsan_suppressions.txt
        run: ./build/MeatTests

  windows:
    name: Windows (MSVC, Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      # glad2's CMake picks the NEWEST python on the runner for its build-time
      # loader codegen, which isn't necessarily the one on PATH or the one a
      # single pip install targets. Installing jinja2 into every interpreter on
      # the box guarantees the one glad chooses can import it.
      - name: Install glad generator dependency (all runner pythons)
        shell: pwsh
        run: |
          Get-ChildItem C:\hostedtoolcache\windows\Python\*\x64\python.exe | ForEach-Object {
            Write-Host "installing jinja2 into $_"
            & $_ -m pip install --quiet jinja2
          }

      - name: Configure
        run: cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: .\build\MeatTests.exe
