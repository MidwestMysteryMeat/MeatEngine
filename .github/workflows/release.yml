name: Release

# Build a packaged game archive for each platform and attach it to a GitHub
# release whenever a version tag is pushed (e.g. `git tag v0.2.0 && git push --tags`).
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload assets

jobs:
  package:
    name: Package (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: windows-2022 # stable MSVC (windows-latest ships a preview that hangs on sol2)
            label: Windows
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols python3 python3-pip
          python3 -m pip install --user jinja2

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Install Windows glad dependency (all pythons)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem C:\hostedtoolcache\windows\Python\*\x64\python.exe | ForEach-Object {
            & $_ -m pip install --quiet jinja2
          }

      - name: Cache build tree
        uses: actions/cache@v4
        with:
          path: build
          key: build-${{ runner.os }}-release-${{ hashFiles('cmake/Dependencies.cmake', 'CMakeLists.txt') }}
          restore-keys: build-${{ runner.os }}-release-

      - name: Configure
        run: cmake -S . -B build -G Ninja -Wno-dev -DCMAKE_BUILD_TYPE=Release

      - name: Build the engine
        run: cmake --build build --target MeatEngine --parallel

      - name: Package
        run: cmake --build build --target package # runs CPack (ZIP, runtime component)

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/MeatEngine-*.zip
          fail_on_unmatched_files: true
